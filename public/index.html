<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ercomaq — Ordens de Serviço</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-top: 16px; }
    .chart-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; }
    .chart-box h3 { margin: 0 0 10px; font-size: 14px; color: #1e293b; }
    .chart-box canvas { max-height: 300px; }
    .chart-box-sm canvas { max-height: 260px; }
    .bi-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
    .bi-filtros label { font-size: 12px; font-weight: bold; display: flex; flex-direction: column; gap: 3px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal"></div>
  <script src="js/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cadastros.js"></script>
</body>
</html>
